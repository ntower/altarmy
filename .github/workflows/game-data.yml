# Game data: keep the site and the addon on the newest wago.tools builds and emulator releases, with nobody
# having to remember it (game_data.py; the pins are site/data/game-data.json).
#
# Daily: regenerate everything made from the game data at the newest builds and releases (game_data.py
# update). It always regenerates, so generator code changed without regenerating is caught too. When anything
# changed, run the site's and the addon's checks on it, then
#   - commit it to main ("Game data: ..."), which runs site-check and then site-deploy: the deploy's ingest
#     jobs load the new pinned build;
#   - but open a PR (branch game-data/patch) instead when a build's major.minor.patch moved: a game patch
#     can move the interface (the TOC, versions.py) and CurseForge's game versions, which need a person.
# Then release the addon (game_data.py release-addon) when only generated game data changed in it since its
# newest addon-v* tag; with hand-written addon work waiting on main, the next manual release ships it.
#
# Requires: GAME_DATA_TOKEN (secret), a fine-grained token for this repository with Contents and Pull requests
# read/write. Pushes and tags made with the workflow's own token would start no workflows (no site-check,
# site-deploy or addon-release). The PR also needs "Allow GitHub Actions to create and approve pull requests".

name: game-data

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

concurrency: game-data

permissions:
  contents: read

env:
  GITHUB_TOKEN: ${{ github.token }} # the emulators' release lookups (gamedata.fetch): no anonymous rate limit

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GAME_DATA_TOKEN }}
          fetch-depth: 0 # tags and history: release-addon compares with the newest addon-v* tag

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install the site
        run: python -m pip install -e "site[dev,ui]"

      - name: Pinned and newest builds and releases
        id: status
        run: python game_data.py status | tee -a "$GITHUB_OUTPUT"

      # One cache per build and release, so a day when one moves downloads only that one
      - uses: actions/cache@v6
        with:
          path: .cache/wago/${{ steps.status.outputs.forever_build }}
          key: wago-${{ steps.status.outputs.forever_build }}
      - uses: actions/cache@v6
        with:
          path: .cache/wago/${{ steps.status.outputs.tbc_build }}
          key: wago-${{ steps.status.outputs.tbc_build }}
      - uses: actions/cache@v6
        with:
          path: .cache/emulators/vmangos/${{ steps.status.outputs.forever_release }}
          key: vmangos-${{ steps.status.outputs.forever_release }}
      - uses: actions/cache@v6
        with:
          path: .cache/emulators/cmangos/${{ steps.status.outputs.tbc_release }}
          key: cmangos-${{ steps.status.outputs.tbc_release }}

      - name: Regenerate the game data
        run: python game_data.py update --message "$RUNNER_TEMP/message.txt" --notes "$RUNNER_TEMP/notes.txt"

      - name: Anything changed?
        id: changed
        run: |
          git add -A -- site/data site/frontend/public/maps addon/data/recipes \
            addon/AltArmy_TBC/Data/Recipes addon/AltArmy_TBC/Data/Economy
          if git diff --cached --quiet; then
            echo "Nothing changed." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            cat "$RUNNER_TEMP/message.txt" >> "$GITHUB_STEP_SUMMARY"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # The checks the commit would face in site-check and addon-check, before anything lands
      - name: Site checks
        if: steps.changed.outputs.changed == 'true'
        working-directory: site
        run: python scripts/check.py --skip-frontend
      - uses: actions/cache@v6
        if: steps.changed.outputs.changed == 'true'
        with:
          path: |
            addon/.lua51
            addon/busted-2.1.1
            addon/luacheck-src
          key: addon-lua-tools-${{ runner.os }}-${{ hashFiles('addon/scripts/setup-dev-tools.js') }}
      - name: Addon checks
        if: steps.changed.outputs.changed == 'true'
        working-directory: addon
        run: |
          sudo apt-get install -y libreadline-dev
          npm ci
          npm run setup:dev
          npm test
          npm run check
          python -m unittest discover -s scripts -p "test_*.py"

      - name: Commit to main
        if: steps.changed.outputs.changed == 'true' && steps.status.outputs.game_patch != 'true'
        run: |
          git commit --quiet -F "$RUNNER_TEMP/message.txt"
          for attempt in 1 2 3; do
            git pull --quiet --rebase origin main && git push origin HEAD:main && exit 0
            sleep 10
          done
          exit 1

      - name: Open a pull request (a game patch)
        if: steps.changed.outputs.changed == 'true' && steps.status.outputs.game_patch == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GAME_DATA_TOKEN }}
          branch: game-data/patch
          delete-branch: true
          commit-message: "Game data: a game patch"
          title: "Game data: a game patch (check the interface and CurseForge versions)"
          body-path: ${{ runner.temp }}/message.txt

      - name: Release the addon
        if: steps.status.outputs.game_patch != 'true'
        run: python game_data.py release-addon --notes "$RUNNER_TEMP/notes.txt"
