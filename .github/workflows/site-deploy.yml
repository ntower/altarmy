name: site-deploy

# Prod: after `site-check` passes for a push to main (so an addon-only push, which never runs site-check,
# never deploys). Staging (or prod by hand): Run workflow.
# Authenticates with Workload Identity Federation (no key): set the repo variables GCP_WIF_PROVIDER and
# GCP_DEPLOY_SA that `site/deploy/setup.sh wif` prints.
on:
  workflow_run:
    workflows: [site-check]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [staging, prod]
        default: staging

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ inputs.environment || 'prod' }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: site

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    env:
      DEPLOY_ENV: ${{ inputs.environment || 'prod' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0 # deploy.sh diffs against the deployed commit to skip the jobs nothing changed for
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm ci
        working-directory: site/frontend
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v3
      - run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
      - id: build
        run: echo "image=$(bash deploy/build.sh "$(git rev-parse --short=12 HEAD)")" >> "$GITHUB_OUTPUT"
      - run: bash deploy/deploy.sh "$DEPLOY_ENV" "${{ steps.build.outputs.image }}"
