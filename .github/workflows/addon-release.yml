# Release the addon (addon/) on an addon-v* tag — build the zip, upload it to CurseForge and Wago via their APIs,
# and attach it to a GitHub Release (AltArmy_TBC.zip, which the Alt Army site links as
# releases/latest/download/AltArmy_TBC.zip: addon releases are the repository's Latest, Alt Army Sync's never are)
# Requires: CURSEFORGE_API_TOKEN, WAGO_API_TOKEN (secrets)
# Requires: CURSEFORGE_PROJECT_ID, CURSEFORGE_DISPLAY_NAME (vars)
# CURSEFORGE_GAME_VERSIONS: CurseForge game version IDs (the specific-version "id", not "gameVersionTypeID") for
#   TBC Classic 2.5.6 (Interface 20506) and WoW Forever 1.60.1 (Interface 16001)
# Wago project ID is read from ## X-Wago-ID in the TOC

name: addon-release

on:
  push:
    tags: ["addon-v*"]
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type"
        required: true
        default: "release"
        type: choice
        options:
          - release
          - beta
          - alpha

env:
  CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
  CURSEFORGE_GAME_VERSIONS: "16533,17053"
  WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
  WAGO_BC_PATCH: "2.5.6"

defaults:
  run:
    working-directory: addon

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Extract version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            ADDON_VERSION="${GITHUB_REF#refs/tags/}"
            ADDON_VERSION="${ADDON_VERSION#addon-v}"
          else
            ADDON_VERSION=$(grep -oP "## Version: \K[^\r\n ]+" AltArmy_TBC/AltArmy_TBC.toc || true)
            [ -z "$ADDON_VERSION" ] && ADDON_VERSION="0.0.0"
          fi
          echo "ADDON_VERSION=$ADDON_VERSION" >> $GITHUB_ENV
          echo "version=$ADDON_VERSION" >> $GITHUB_OUTPUT

      - name: Set release type
        id: release_type
        run: |
          if [[ "${{ github.event.inputs.release_type }}" != "" ]]; then
            RELEASE_TYPE="${{ github.event.inputs.release_type }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            if [[ "$TAG" == *alpha* ]]; then RELEASE_TYPE="alpha"
            elif [[ "$TAG" == *beta* ]]; then RELEASE_TYPE="beta"
            else RELEASE_TYPE="release"
            fi
          else
            RELEASE_TYPE="alpha"
          fi
          echo "RELEASE_TYPE=$RELEASE_TYPE" >> $GITHUB_ENV
          echo "release_type=$RELEASE_TYPE" >> $GITHUB_OUTPUT

      - name: Build zip
        run: |
          DISPLAY_NAME="${{ vars.CURSEFORGE_DISPLAY_NAME }} v$ADDON_VERSION"
          ZIP_FILE_NAME="AltArmy_TBC-$ADDON_VERSION.zip"
          zip -r -9 "$ZIP_FILE_NAME" AltArmy_TBC/
          echo "DISPLAY_NAME=$DISPLAY_NAME" >> $GITHUB_ENV
          echo "ZIP_FILE_NAME=$ZIP_FILE_NAME" >> $GITHUB_ENV

      - name: Upload to CurseForge
        run: |
          if [ -f CHANGELOG.txt ]; then
            CHANGELOG_FILE="CHANGELOG.txt"
          else
            echo "See repository for changes." > CHANGELOG.txt
            CHANGELOG_FILE="CHANGELOG.txt"
          fi
          GAME_VERSIONS_JSON=$(echo "$CURSEFORGE_GAME_VERSIONS" | jq -R 'split(",") | map(gsub(" "; "") | tonumber)')
          API_URL="https://wow.curseforge.com/api/projects/${{ vars.CURSEFORGE_PROJECT_ID }}/upload-file"
          echo "Uploading to: $API_URL"
          METADATA=$(jq -n \
            --arg displayName "$DISPLAY_NAME" \
            --arg releaseType "$RELEASE_TYPE" \
            --argjson gameVersions "$GAME_VERSIONS_JSON" \
            --rawfile changelog "$CHANGELOG_FILE" \
            '{displayName: $displayName, changelog: $changelog, changelogType: "text", releaseType: $releaseType, gameVersions: $gameVersions}')
          HTTP_CODE=$(curl -s -w "%{http_code}" -o /tmp/curseforge_response.txt -X POST \
            -H "X-Api-Token: ${{ secrets.CURSEFORGE_API_TOKEN }}" \
            -F "metadata=$METADATA;type=application/json" \
            -F "file=@$ZIP_FILE_NAME" \
            "$API_URL")
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "CurseForge API returned HTTP $HTTP_CODE. Response:"
            cat /tmp/curseforge_response.txt
            exit 1
          fi
          echo "Uploaded $ZIP_FILE_NAME as $RELEASE_TYPE (HTTP $HTTP_CODE)"

      - name: Upload to Wago
        run: |
          WAGO_PROJECT_ID=$(grep -oP "## X-Wago-ID: \K[^\r\n ]+" AltArmy_TBC/AltArmy_TBC.toc || true)
          if [ -z "$WAGO_PROJECT_ID" ]; then
            echo "Missing ## X-Wago-ID in AltArmy_TBC/AltArmy_TBC.toc"
            exit 1
          fi
          if [ -z "$WAGO_API_TOKEN" ]; then
            echo "Missing WAGO_API_TOKEN secret"
            exit 1
          fi
          if [ -f CHANGELOG.txt ]; then
            CHANGELOG_FILE="CHANGELOG.txt"
          else
            echo "See repository for changes." > CHANGELOG.txt
            CHANGELOG_FILE="CHANGELOG.txt"
          fi
          case "$RELEASE_TYPE" in
            release) WAGO_STABILITY="stable" ;;
            beta)    WAGO_STABILITY="beta" ;;
            alpha)   WAGO_STABILITY="alpha" ;;
            *)       WAGO_STABILITY="stable" ;;
          esac
          API_URL="https://addons.wago.io/api/projects/${WAGO_PROJECT_ID}/version"
          echo "Uploading to: $API_URL (stability=$WAGO_STABILITY, bc=$WAGO_BC_PATCH)"
          METADATA=$(jq -n \
            --arg label "$ADDON_VERSION" \
            --arg stability "$WAGO_STABILITY" \
            --arg supported_bc_patch "$WAGO_BC_PATCH" \
            --rawfile changelog "$CHANGELOG_FILE" \
            '{label: $label, stability: $stability, changelog: $changelog, supported_bc_patch: $supported_bc_patch}')
          HTTP_CODE=$(curl -s -w "%{http_code}" -o /tmp/wago_response.txt -X POST \
            -H "authorization: Bearer ${{ secrets.WAGO_API_TOKEN }}" \
            -H "accept: application/json" \
            -F "metadata=$METADATA" \
            -F "file=@$ZIP_FILE_NAME" \
            "$API_URL")
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "Wago API returned HTTP $HTTP_CODE. Response:"
            cat /tmp/wago_response.txt
            exit 1
          fi
          echo "Uploaded $ZIP_FILE_NAME to Wago as $WAGO_STABILITY (HTTP $HTTP_CODE)"
          cat /tmp/wago_response.txt

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "$ZIP_FILE_NAME" AltArmy_TBC.zip
          PRERELEASE=""
          if [ "$RELEASE_TYPE" != "release" ]; then PRERELEASE="--prerelease"; fi
          # A prerelease never becomes releases/latest, so the site's link always gets a stable build.
          gh release create "${GITHUB_REF#refs/tags/}" AltArmy_TBC.zip "$ZIP_FILE_NAME" \
            --title "$DISPLAY_NAME" --notes-file CHANGELOG.txt $PRERELEASE
