[project]
name = "altarmy-site"
version = "0.1.0"
description = "WoW Forever crafting profit finder (items, recipes, AH prices, disenchant chains)"
requires-python = ">=3.11"
dependencies = ["sqlalchemy>=2.0", "alembic>=1.13"]

[project.optional-dependencies]
# the server (API, `serve`); firebase-admin verifies Firebase ID tokens
ui = ["fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.9", "firebase-admin>=6.5"]
postgres = ["psycopg[binary]>=3.2"]
# watchfiles: `serve --reload` (npm run dev) watches the code without polling it
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10", "httpx2>=2.13", "psycopg[binary]>=3.2", "watchfiles>=0.21"]
# Alt Army Sync, the Windows uploader (altarmy-sync); build-tray packages it as one .exe
tray = ["pystray>=0.19", "Pillow>=10"]
build-tray = ["pyinstaller>=6.10"]

[project.scripts]
altarmy-site = "altarmy_site.cli:main"

[project.gui-scripts]
altarmy-sync = "altarmy_site.tray:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Alembic's revision files are not a package; ship them (and the template for new ones) as data.
altarmy_site = ["migrations/script.py.mako", "migrations/versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]


[[tool.mypy.overrides]]
# firebase-admin (the `ui` extra) ships no type hints.
module = ["firebase_admin", "firebase_admin.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# google-cloud-storage (the archive's bucket; firebase-admin brings it) ships no type hints.
module = ["google.cloud", "google.cloud.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The tray extra: pystray ships no type hints; CI's check doesn't install the extra at all.
module = ["pystray", "pystray.*", "PIL", "PIL.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# pytest's type hints import numpy when it is installed; numpy's stubs use 3.12-only syntax that mypy
# rejects under python_version 3.11.
module = ["numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
